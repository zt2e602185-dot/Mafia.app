<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
</head><body><div id="app"></div>
<script>
const A=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R={maf:['🔪','المافيا','تقتل لاعباً كل ليلة'],sil:['🤐','المافيا المسكت','من المافيا، ويمنع لاعباً من الكلام في النهار التالي'],doc:['💉','الطبيب','ينقذ لاعباً كل ليلة'],det:['🕵️','المحقق','يسأل عن لاعب: مافيا أم بريء'],grd:['🛡️','الحارس','يحمي لاعباً، وإن هاجمته المافيا يموت الحارس بدلاً منه'],snp:['🎯','القناص','رصاصة واحدة طوال اللعبة، وإن أصاب بريئاً يموت معه'],jes:['🤡','المهرج','يفوز وحده إذا أقنعكم بالتصويت عليه'],may:['🎖️','العمدة','يكشف بطاقته في النقاش فيصبح تصويته بعدها يعادل 3 أصوات'],avg:['🗡️','المنتقم','إن أُقصي بالتصويت يأخذ معه لاعباً من اختياره'],cit:['🙂','المواطن','بلا قدرة خاصة']};
let S={names:[],mc:1,self:false,reveal:true,timer:120,sound:true,on:{sil:true,doc:true,det:true,grd:false,snp:false,jes:false}};
try{const o=JSON.parse(localStorage.getItem('mf')||'{}');Object.assign(S,o);S.on=Object.assign({sil:true,doc:true,det:true,grd:false,snp:false,jes:false},o.on||{})}catch(e){}
const save=()=>{try{localStorage.setItem('mf',JSON.stringify(S))}catch(e){}};
let AC=null;
const beep=(f=520,d=.2)=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}try{navigator.vibrate&&navigator.vibrate(150)}catch(e){}};
const arVoice=()=>{try{return speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang))}catch(e){}};
try{speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
let ST=null;
const say=(t,d=0)=>{return;
  if(d&&window.speechSynthesis){try{const z=new SpeechSynthesisUtterance(' ');z.volume=0;speechSynthesis.speak(z)}catch(e){}}
  ST=setTimeout(()=>{beep();if(!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),v=arVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang='ar-SA';u.rate=.9;u.volume=1;speechSynthesis.speak(u)}catch(e){}},d)};
function testSound(){
  const el=document.getElementById('snd');say('المافيا، افتحوا أعينكم');
  el.textContent=!window.speechSynthesis?'متصفحك لا يدعم النطق، سيُستخدم تنبيه صوتي فقط':!arVoice()?'لا يوجد صوت عربي مثبّت في جهازك، فسيُسمع تنبيه صوتي فقط. ثبّت صوتاً عربياً من إعدادات النظام (تحويل النص إلى كلام)':'يعمل الصوت العربي. إن لم تسمع شيئاً فارفع مستوى صوت الجهاز وتأكد أنه ليس في الوضع الصامت';
}
let G=null;
let show=h=>{clearInterval(G&&G.iv);A.innerHTML=h;window.scrollTo(0,0)};
const isM=p=>p.r=='maf'||p.r=='sil';
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- الإعدادات ---------- */
function warn(){
  const n=S.names.length;
  if(n<4)return 'أضف 4 لاعبين على الأقل لبدء اللعبة';
  if(S.on.sil&&S.mc<2)return 'المافيا المسكت تحتاج فريق مافيا من 2 أو أكثر، زد العدد أو عطّل الدور';
  const sp=S.mc+['doc','det','grd','snp','jes','may','avg'].filter(k=>S.on[k]).length;
  if(sp>n-1)return 'الأدوار المفعّلة أكثر من اللاعبين، عطّل بعضها أو أضف لاعبين';
  return '';
}
function setup(keep){const y=window.scrollY;setup0();if(keep===1)window.scrollTo(0,y)}
function setup0(){
  G=null;const n=S.names.length,mx=Math.max(1,Math.floor((n-1)/2));
  if(S.mc>mx)S.mc=mx;if(S.mc<1)S.mc=1;save();
  const w=warn(),tm=[[0,'بلا مؤقت'],[60,'دقيقة'],[120,'دقيقتان'],[180,'3 دقائق'],[300,'5 دقائق']];
  const roles=['sil','doc','det','grd','snp','jes','may','avg'].map(k=>`<div class="rc ${S.on[k]?'on':''}" onclick="tog('${k}',${!S.on[k]})"><span class="chk">✓</span><div class="ri">${R[k][0]}</div><b>${R[k][1]}</b><small>${R[k][2]}</small></div>`).join('');
  show(`<h1>🎭 لعبة المافيا</h1>
  <h3>اللاعبون (${n})</h3><div class="card"><div class="in"><input id="nm" placeholder="اسم أو عدة أسماء بفاصلة" onkeydown="if(event.key==='Enter')add()"><button onclick="add()">＋</button></div>
  <div class="chips">${S.names.map((x,i)=>`<span class="chip">${esc(x)}<b onclick="rm(${i})">×</b></span>`).join('')}</div></div>
  <h3>القواعد</h3><div class="card">
  <div class="row"><span>عدد فريق المافيا<small>الحد الأقصى ${mx}</small></span><span class="st"><button onclick="mc(-1)">−</button><b>${S.mc}</b><button onclick="mc(1)">+</button></span></div>
  <label class="row"><span>السماح بالتصويت على النفس</span><input type="checkbox" ${S.self?'checked':''} onchange="S.self=this.checked;save()"></label>
  <label class="row"><span>إظهار الدور عند الموت أو الإقصاء</span><input type="checkbox" ${S.reveal?'checked':''} onchange="S.reveal=this.checked;save()"></label>
  <label class="row"><span>مؤقت النقاش</span><select onchange="S.timer=+this.value;save()">${tm.map(t=>`<option value="${t[0]}" ${S.timer==t[0]?'selected':''}>${t[1]}</option>`).join('')}</select></label></div>
  <h3>الأدوار الخاصة</h3><div class="rgrid">${roles}</div>
  ${w?`<div class="warn">${w}</div>`:''}
  <button class="pr" ${w?'disabled':''} onclick="start()">ابدأ اللعبة</button>`);
}
function add(){const v=document.getElementById('nm').value.split(/[,،]/).map(s=>s.trim()).filter(s=>s&&!S.names.includes(s));S.names.push(...v);setup(1)}
function rm(i){S.names.splice(i,1);setup(1)}
function mc(d){S.mc+=d;setup(1)}
function tog(k,v){S.on[k]=v;setup(1)}

/* ---------- البداية وكشف الأدوار ---------- */
function start(){
  const n=S.names.length,r=[];
  for(let i=0;i<S.mc;i++)r.push('maf');
  if(S.on.sil)r[0]='sil';
  ['doc','det','grd','snp','jes','may','avg'].forEach(k=>S.on[k]&&r.push(k));
  while(r.length<n)r.push('cit');
  shuffle(r);
  G={p:S.names.map((x,i)=>({n:x,r:r[i],a:true})),used:false,sil:null,iv:0};
  rev(0);
}
function rev(i){
  if(i>=G.p.length)return night();
  show(`<h2>🎴 كشف الأدوار</h2><p class="big">مرّر الهاتف إلى<br><b>${esc(G.p[i].n)}</b></p><p class="mu">لا ينظر أحد غيره إلى الشاشة</p><button class="pr" onclick="showRole(${i})">أنا ${esc(G.p[i].n)}، اكشف دوري</button>`);
}
function showRole(i){
  const p=G.p[i],m=isM(p)?G.p.filter((q,j)=>j!=i&&isM(q)).map(q=>esc(q.n)+' ('+R[q.r][1]+')'):[];
  show(`<div class="role">${R[p.r][0]}</div><h2>${R[p.r][1]}</h2><p class="big">${R[p.r][2]}</p>${isM(p)?`<div class="card"><b>زملاؤك في المافيا:</b><br>${m.length?m.join('، '):'أنت وحدك'}</div>`:''}<button class="pr" onclick="rev(${i+1})">أخفِ الدور وأعطِ الهاتف لمن بعدك</button>`);
}

/* ---------- الليل ---------- */
const ORDER=['maf','doc','det','grd','snp'],SN={maf:'المافيا',doc:'الطبيب',det:'المحقق',grd:'الحارس',snp:'القناص'};
function night(){
  G.nt={};G.steps=ORDER.filter(k=>k=='maf'||G.p.some(p=>p.r==k));G.si=0;
  const t='يغمض الجميع أعينهم، أو يمرّرون الهاتف إلى المُقدِّم';
  show(`<h2>🌙 حلّ الليل</h2><p class="big">${t}</p><p class="mu">لا يفتح أحد عينيه حتى يُنادى دوره</p><button class="pr" onclick="step()">الجميع مغمض، ابدأ</button>`);
  say('حلّ الليل. '+t+'. لا يفتح أحد عينيه حتى يُنادى دوره.');
}
function step(){
  if(G.si>=G.steps.length)return morning();
  const k=G.steps[G.si],ph=k=='maf'?'أفراد المافيا، افتحوا أعينكم':SN[k]+'، افتح عينيك';
  show(`<h2>${R[k][0]} ${SN[k]}</h2><p class="big">${ph}</p><p class="mu">البقية يبقون مغمضي الأعين<br>سيُسمع النداء بعد 3 ثوانٍ ليغمض صاحب الدور عينيه</p><button class="pr" onclick="act()">${SN[k]} فتح عينيه</button>`);
  const pk=G.steps[G.si-1],cl=!pk?'':(pk=='maf'?'أفراد المافيا، أغمضوا أعينكم. ':SN[pk]+'، أغمض عينيك. ');say(cl+ph,3000);
}
function pick(t,ids,cb,skip){
  let sel=null;
  window._sel=i=>{sel=i;document.querySelectorAll('.opt').forEach(e=>e.classList.toggle('on',e.dataset.i==i));document.getElementById('ok').disabled=false};
  window._ok=()=>{if(sel!==null)cb(sel)};window._sk=()=>cb(-1);
  show(`<h2>${t}</h2><div class="grid">${ids.map(i=>`<button class="opt" data-i="${i}" onclick="_sel(${i})">${esc(G.p[i].n)}</button>`).join('')}</div><button id="ok" class="pr" disabled onclick="_ok()">تأكيد</button>${skip?`<button class="sec" onclick="_sk()">${skip}</button>`:''}`);
}
function act(){
  const k=G.steps[G.si],P=G.p,al=P.map((p,i)=>i).filter(i=>P[i].a);
  const live=k=='snp'?P.some(p=>p.a&&p.r=='snp')&&!G.used:P.some(p=>p.a&&(k=='maf'?isM(p):p.r==k));
  if(k=='maf')pick('اختر ضحية الليلة',al.filter(i=>!isM(P[i])),t=>{G.nt.kill=t;
    if(P.some(p=>p.r=='sil'))pick('اختر من يُمنع من الكلام غداً',al,s=>{G.nt.sil=s;done()});else done()});
  if(k=='doc')pick('من تنقذ الليلة؟',al,t=>{G.nt.doc=t;done()});
  if(k=='grd')pick('من تحمي الليلة؟',al.filter(i=>P[i].r!='grd'),t=>{G.nt.grd=t;done()});
  if(k=='snp')pick('هل تطلق رصاصتك؟',al.filter(i=>P[i].r!='snp'),t=>{if(t>=0)G.nt.snp=t;done()},'لن أطلق الآن');
  if(k=='det')pick('عمّن تسأل؟',al.filter(i=>P[i].r!='det'),t=>{
    const m=live&&isM(P[t]);
    show(`<h2>🕵️ النتيجة</h2><p class="big"><b>${esc(P[t].n)}</b><br>${m?'🔪 مافيا':'😇 بريء'}</p><button class="pr" onclick="done()">أغمض عينيك وتابع</button>`)});
}
function done(){
  const k=G.steps[G.si],t=k=='maf'?'أفراد المافيا، أغمضوا أعينكم':SN[k]+'، أغمض عينيك';
  show(`<h2>🙈</h2><p class="big">${t}</p><button class="pr" onclick="G.si++;step()">متابعة</button>`);
}
function win(){
  const m=G.p.filter(p=>p.a&&isM(p)).length,o=G.p.filter(p=>p.a&&!isM(p)).length;
  return m==0?'cit':m>=o?'maf':null;
}
function morning0(){
  const n=G.nt,P=G.p,d=[];
  const K=p=>{if(p.a){p.a=false;d.push(p)}},F=r=>P.find(p=>p.a&&p.r==r);
  const sn=F('snp');
  if(sn&&!G.used&&n.snp!=null){G.used=true;const t=P[n.snp];if(t.a){K(t);if(!isM(t))K(sn)}}
  let ev='';if(n.kill!=null&&P[n.kill].a){const g=F('grd'),dc=F('doc');
    if(g&&n.grd==n.kill){K(g);ev='guard'}else if(dc&&n.doc==n.kill)ev='doc';else K(P[n.kill])}
  ev=ev||'dead';G.ev=n.kill==null?'':ev;const tn=n.kill==null?'':esc(P[n.kill].n);
  const story=n.kill==null?'':`<div class="card" style="text-align:center;line-height:2;font-size:19px">🔪 تمت محاولة اغتيال <b style="color:var(--gold)">${tn}</b>!<br>${ev=='doc'?'💉 لكن الطبيب تدخّل ومنع جريمة بشعة من الحدوث.':ev=='guard'?'🛡️ لكن أحدهم تلقّى الضربة بدلاً منه.':'🩸 سالت الدماء وفشل الطبيب في إنقاذه.'}</div>`;
  const s=F('sil');G.sil=s&&n.sil!=null&&P[n.sil].a?n.sil:null;
  const w=win();
  show(`<h2>☀️ طلع الصباح</h2>${story}${d.length?d.map(p=>`<p class="big">💀 <b>${esc(p.n)}</b>${S.reveal?'<br>'+R[p.r][0]+' '+R[p.r][1]:''}</p>`).join(''):'<p class="big">مرّت الليلة بسلام 🌤️</p>'}${G.sil!=null?`<div class="warn">🤐 ممنوع من الكلام اليوم: <b>${esc(P[G.sil].n)}</b></div>`:''}<button class="pr" onclick="${w?`end('${w}')`:'day()'}">${w?'النتيجة':'ابدأ النقاش'}</button>`);
  
}

/* ---------- النقاش والتصويت ---------- */
function day(){
  let t=S.timer;
  const f=()=>{const e=document.getElementById('tm');if(e)e.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
  show(`<h2>🗣️ النقاش</h2>${G.sil!=null?`<div class="warn">🤐 ${esc(G.p[G.sil].n)} ممنوع من الكلام</div>`:''}${t?'<div id="tm" class="timer"></div>':'<p class="mu">بلا مؤقت</p>'}<p class="mu">الأحياء: ${G.p.filter(p=>p.a).map(p=>esc(p.n)).join('، ')}</p><button class="pr" onclick="vote()">ابدأ التصويت</button>`);
  if(t){f();G.iv=setInterval(()=>{t--;f();if(t<=0){clearInterval(G.iv);say('انتهى وقت النقاش')}},1000)}
}
function vote(){G.vi=0;G.vc={};vturn()}
function vturn(){
  const P=G.p,vs=P.map((p,i)=>i).filter(i=>P[i].a);
  if(G.vi>=vs.length)return tally();
  const me=vs[G.vi];
  pick(`دور ${esc(P[me].n)}<br>صوّت لإقصاء أحدهم`,vs.filter(i=>S.self||i!=me),t=>{G.vc[t]=(G.vc[t]||0)+1;G.vi++;vturn()});
}
function tally(){
  const P=G.p,e=Object.entries(G.vc).sort((a,b)=>b[1]-a[1]);
  const lines=e.map(([i,c])=>`<div class="row"><span>${esc(P[i].n)}</span><b>${c}</b></div>`).join('');
  let out,w=null;
  if(!e.length||(e.length>1&&e[0][1]==e[1][1]))out='تعادل، لا أحد يُقصى';
  else{const p=P[e[0][0]];p.a=false;out=`أُقصي <b>${esc(p.n)}</b>`+(S.reveal?`<br>وكان ${R[p.r][0]} ${R[p.r][1]}`:'');w=p.r=='jes'?'jes':win()}
  show(`<h2>🗳️ نتيجة التصويت</h2><div class="card">${lines}</div><p class="big">${out}</p><button class="pr" onclick="${w?`end('${w}')`:'night()'}">${w?'النتيجة':'ليلة جديدة'}</button>`);
}

/* ---------- النهاية ---------- */
function end(w){
  const T={maf:['🔪 فازت المافيا','المافيا سيطرت على المدينة'],cit:['🏆 فاز المواطنون','تم القضاء على المافيا'],jes:['🤡 فاز المهرج!','أقنعكم بالتصويت عليه']};
  show(`<h2>${T[w][0]}</h2><p class="mu">${T[w][1]}</p><div class="card">${G.p.map(p=>`<div class="row"><span>${p.a?'':'💀 '}${esc(p.n)}</span><span>${R[p.r][0]} ${R[p.r][1]}</span></div>`).join('')}</div><button class="pr" onclick="start()">جولة جديدة بنفس اللاعبين</button><button class="sec" onclick="setup()">الإعدادات</button>`);
  
}
const holders=k=>G.p.filter(p=>k=='maf'?isM(p):p.r==k).map(p=>esc(p.n)).join(' و ');
function night(){
  G.nt={};G.steps=ORDER.filter(k=>k=='maf'||G.p.some(p=>p.r==k));G.si=0;
  show(`<h2>🌙 حلّ الليل</h2><p class="big">سيطلب منك التطبيق تمرير الهاتف إلى لاعب معيّن ليؤدّي دوره سرّاً</p><p class="mu">بقية اللاعبين لا ينظرون إلى الشاشة</p><button class="pr" onclick="step()">ابدأ</button>`);
}
function step(){
  if(G.si>=G.steps.length)return morning();
  const k=G.steps[G.si];
  show(`<h2>📱 مرّر الهاتف</h2><p class="big">مرّر الهاتف إلى<br><b>${holders(k)}</b></p><p class="mu">ليؤدّي دوره سرّاً، ولا ينظر أحد غيره إلى الشاشة</p><button class="pr" onclick="act()">استلمت الهاتف</button>`);
}
function done(){
  show(`<h2>✅ تم</h2><p class="big">أخفِ الشاشة وسلّم الهاتف للمُقدِّم</p><button class="pr" onclick="G.si++;step()">التالي</button>`);
}
function morning(){
  const s0=show;let html='';show=h=>{html=h};
  try{morning0()}finally{show=s0}
  const go=()=>show(html);
  if(!G.ev)return go();
  show(`<h2>🌅 انتهت الليلة</h2><p class="big">ماذا حدث في الظلام؟</p><button class="pr" onclick="G.rv()">اظهار النتائج</button>`);
  G.rv=()=>fx(G.ev,go);
}
function fx(ev,cb){
  const el=document.createElement('div');let h='';
  if(ev=='dead'){
    let d='';for(let i=0;i<16;i++)d+=`<i class="dr" style="left:${Math.random()*96}%;width:${14+Math.random()*22}px;--h:${40+Math.random()*65}%;--t:${1.6+Math.random()*1.4}s;--d:${.9+Math.random()*.8}s"></i>`;
    el.className='fx kill';h=`<div class="bl"></div>${d}<div class="knife">🔪</div><div class="slash"></div><div class="cap">🩸 تمّ الاغتيال</div>`;
  }else{
    let s='',r='';
    for(let i=0;i<8;i++){const a=i*Math.PI/4;s+=`<i class="sp" style="--x:${Math.cos(a)*130}px;--y:${Math.sin(a)*130}px">✨</i>`}
    for(let i=0;i<3;i++)r+=`<i class="rg" style="--d:${i*.65}s"></i>`;
    el.className='fx save';h=`${r}<div class="knife">🔪</div>${s}<div class="hero">${ev=='doc'?'💉':'🛡️'}</div><div class="cap">${ev=='doc'?'تدخّل الطبيب وأنقذ الضحية':'ضحّى الحارس بنفسه'}</div>`;
  }
  el.innerHTML=h;document.body.appendChild(el);
  let fin=false;const end=()=>{if(fin)return;fin=true;el.style.transition='opacity .4s';el.style.opacity=0;setTimeout(()=>{el.remove();cb()},400)};
  setTimeout(end,ev=='dead'?3800:3500);el.onclick=end;
  try{navigator.vibrate&&navigator.vibrate(ev=='dead'?[0,120,60,220]:[60])}catch(e){}
}
function night(){
  const P=G.p,t=[];let mf=false;G.nt={};
  P.forEach((p,i)=>{if(!p.a)return;if(isM(p)){if(!mf){mf=true;t.push({k:'maf'})}}else t.push({k:p.r,i})});
  G.steps=shuffle(t);G.si=0;
  show(`<h2>🌙 حلّ الليل</h2><p class="big">سيطلب منك التطبيق تمرير الهاتف إلى لاعب معيّن ليؤدّي دوره سرّاً</p><p class="mu">سيُنادى على كل لاعب حيّ بترتيب عشوائي، حتى لا يعرف أحد أدوار غيره</p><button class="pr" onclick="step()">ابدأ</button>`);
}
function step(){
  if(G.si>=G.steps.length)return morning();
  const t=G.steps[G.si],nm=t.k=='maf'?G.p.filter(p=>p.a&&isM(p)).map(p=>esc(p.n)).join(' و '):esc(G.p[t.i].n);
  show(`<h2>📱 مرّر الهاتف</h2><p class="big">مرّر الهاتف إلى<br><b>${nm}</b></p><p class="mu">ليؤدّي دوره سرّاً، ولا ينظر أحد غيره إلى الشاشة</p><button class="pr" onclick="act()">استلمت الهاتف</button>`);
}
function act(){
  const t=G.steps[G.si],k=t.k,P=G.p,al=P.map((p,i)=>i).filter(i=>P[i].a),ot=al.filter(i=>i!=t.i);
  if(k=='maf')pick('اختر ضحية الليلة',al.filter(i=>!isM(P[i])),x=>{G.nt.kill=x;
    if(P.some(p=>p.r=='sil'))pick('اختر من يُمنع من الكلام غداً',al,s=>{G.nt.sil=s;done()});else done()});
  else if(k=='doc')pick('من تنقذ الليلة؟',al,x=>{G.nt.doc=x;done()});
  else if(k=='grd')pick('من تحمي الليلة؟',ot,x=>{G.nt.grd=x;done()});
  else if(k=='snp')pick('هل تطلق رصاصتك؟',ot,x=>{if(x>=0&&!G.used)G.nt.snp=x;done()},'لن أطلق الآن');
  else if(k=='det')pick('عمّن تسأل؟',ot,x=>show(`<h2>🕵️ النتيجة</h2><p class="big"><b>${esc(P[x].n)}</b><br>${isM(P[x])?'🔪 مافيا':'😇 بريء'}</p><button class="pr" onclick="done()">متابعة</button>`));
  else pick('ليس لديك قدرة ليلاً.<br>اختر أي لاعب للتمويه فقط، لا تأثير لاختيارك',ot,()=>done());
}
function day(t){
  if(t===undefined)t=S.timer;G.left=t;const tm=S.timer>0;
  const f=()=>{const e=document.getElementById('tm');if(e)e.textContent=t>0?String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'):'⏰ انتهى الوقت'};
  show(`<h2>🗣️ النقاش</h2>${G.sil!=null&&G.p[G.sil].a?`<div class="warn">🤐 ${esc(G.p[G.sil].n)} ممنوع من الكلام</div>`:''}${G.rev?'<div class="card" style="text-align:center">🎖️ العمدة مكشوف: تصويته = 3 أصوات</div>':''}${tm?'<div id="tm" class="timer"></div>':'<p class="mu">بلا مؤقت</p>'}<p class="mu">الأحياء: ${G.p.filter(p=>p.a).map(p=>esc(p.n)).join('، ')}</p>${G.p.some(p=>p.r=='may')&&!G.rev?'<button class="sec" onclick="mayBtn()">🎖️ كشف بطاقة العمدة</button>':''}<button class="pr" onclick="vote()">ابدأ التصويت</button>`);
  if(tm){f();if(t>0)G.iv=setInterval(()=>{t--;G.left=t;f();if(t<=0)clearInterval(G.iv)},1000)}
}
function mayBtn(){
  const al=G.p.map((p,i)=>i).filter(i=>G.p[i].a);
  pick('من يكشف بطاقة العمدة؟<br>اضغط على اسمك',al,x=>{
    if(x<0)return day(G.left);
    const ok=G.p[x].r=='may';if(ok)G.rev=true;
    show(`<h2>${ok?'🎖️ العمدة!':'❌ ليست بطاقة العمدة'}</h2><p class="big"><b>${esc(G.p[x].n)}</b><br>${ok?'كشف بطاقته، وتصويته الآن يساوي 3 أصوات':'هذا اللاعب ليس العمدة'}</p><button class="pr" onclick="day(G.left)">عودة للنقاش</button>`)},'رجوع');
}
function vote(){G.vv={};G.vi=0;vturn()}
function vturn(){
  const P=G.p,vs=P.map((p,i)=>i).filter(i=>P[i].a);
  if(G.vi>=vs.length)return review();
  const me=vs[G.vi];
  pick(`دور ${esc(P[me].n)}<br>صوّت لإقصاء أحدهم`,vs.filter(i=>S.self||i!=me),t=>{G.vv[me]=t;G.vi++;vturn()});
}
const wt=i=>G.p[i].r=='may'&&G.rev?3:1;
function review(){
  const P=G.p;
  show(`<h2>🗳️ تم التصويت</h2><div class="card">${Object.keys(G.vv).map(i=>`<div class="row"><span>${esc(P[i].n)}${wt(i)>1?' 🎖️×3':''}</span><span>← ${esc(P[G.vv[i]].n)}</span></div>`).join('')}</div><button class="sec" onclick="chg()">↩️ تغيير تصويت</button><button class="pr" onclick="tally()">اعتماد النتيجة</button>`);
}
function chg(){
  pick('من يريد تغيير تصويته؟',Object.keys(G.vv).map(Number),v=>{
    if(v<0)return review();
    pick(`${esc(G.p[v].n)}، اختر من تظنه المافيا`,G.p.map((p,i)=>i).filter(i=>G.p[i].a&&(S.self||i!=v)),t=>{if(t>=0)G.vv[v]=t;review()},'رجوع');
  },'رجوع');
}
function tally(){
  const P=G.p,c={};
  Object.keys(G.vv).forEach(v=>{const t=G.vv[v];c[t]=(c[t]||0)+wt(v)});
  const e=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  const lines=e.map(([i,n])=>`<div class="row"><span>${esc(P[i].n)}</span><b>${n}</b></div>`).join('');
  let out,w=null,go=null;
  if(!e.length||(e.length>1&&e[0][1]==e[1][1]))out='تعادل، لا أحد يُقصى';
  else{const p=P[e[0][0]];p.a=false;out=`أُقصي <b>${esc(p.n)}</b>`+(S.reveal?`<br>وكان ${R[p.r][0]} ${R[p.r][1]}`:'');
    if(p.r=='jes')w='jes';else if(p.r=='avg'&&P.some(q=>q.a))go='avenge()';else w=win()}
  show(`<h2>🗳️ نتيجة التصويت</h2><div class="card">${lines}</div><p class="big">${out}</p><button class="pr" onclick="${go||(w?`end('${w}')`:'night()')}">${go?'🗡️ المنتقم يختار':w?'النتيجة':'ليلة جديدة'}</button>`);
}
function avenge(){
  const P=G.p,al=P.map((p,i)=>i).filter(i=>P[i].a);
  pick('🗡️ أيها المنتقم، اختر من تأخذه معك',al,x=>{
    const p=P[x];p.a=false;const w=win();
    show(`<h2>🗡️ انتقام!</h2><p class="big">أخذ المنتقم معه<br><b>${esc(p.n)}</b>${S.reveal?`<br>${R[p.r][0]} ${R[p.r][1]}`:''}</p><button class="pr" onclick="${w?`end('${w}')`:'night()'}">${w?'النتيجة':'ليلة جديدة'}</button>`)});
}
function start(){
  const n=S.names.length,r=[];
  for(let i=0;i<S.mc;i++)r.push('maf');
  if(S.on.sil)r[0]='sil';
  ['doc','det','grd','snp','jes','may','avg'].forEach(k=>S.on[k]&&r.push(k));
  while(r.length<n)r.push('cit');
  G={p:S.names.map(x=>({n:x,r:null,a:true})),deck:shuffle(r),used:false,sil:null,iv:0};
  rev(0);
}
function rev(i){
  if(i>=G.p.length)return night();
  show(`<h2>🎴 اختيار البطاقات</h2><p class="big">مرّر الهاتف إلى<br><b>${esc(G.p[i].n)}</b></p><p class="mu">لا ينظر أحد غيره إلى الشاشة</p><button class="pr" onclick="cards(${i})">أنا ${esc(G.p[i].n)}، أريد اختيار بطاقتي</button>`);
}
function cards(i){
  G.lock=false;
  show(`<h2>${esc(G.p[i].n)}، اختر بطاقتك</h2><p class="mu">اضغط على البطاقة التي تشعر أنها لك</p><div class="deck">${G.deck.map((_,j)=>`<div class="cd" onclick="pickCard(${i},${j},this)"><span>✦</span></div>`).join('')}</div>`);
}
function pickCard(i,j,el){
  if(G.lock)return;G.lock=true;
  document.querySelector('.deck').classList.add('dim');el.classList.add('sel');
  try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
  setTimeout(()=>{G.p[i].r=G.deck.splice(j,1)[0];showRole(i)},1200);
}
function showRole(i){
  const p=G.p[i];
  show(`<div class="flip"><div class="fc"><div class="role">${R[p.r][0]}</div><h2>${R[p.r][1]}</h2><p class="big" style="margin:8px 0">${R[p.r][2]}</p>${isM(p)?'<p class="mu">ستتعرّف على زملائك حين يُنادى فريق المافيا في الليلة':''}</div></div><button class="pr" onclick="rev(${i+1})">أخفِ الدور وأعطِ الهاتف لمن بعدك</button>`);
}
const KN='<svg viewBox="0 0 60 200"><defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#6b7280"/><stop offset=".5" stop-color="#f8fafc"/><stop offset="1" stop-color="#9ca3af"/></linearGradient></defs><path d="M30 198 L8 70 Q10 56 30 52 Q50 56 52 70 Z" fill="url(#bg)"/><path d="M30 196 L30 58" stroke="#fff" stroke-width="1.5" opacity=".8"/><rect x="14" y="50" width="32" height="7" rx="2" fill="#666"/><rect x="20" y="4" width="20" height="48" rx="6" fill="#1c1c1c"/></svg>';
function splats(){
  let s='';const C=['#7a0010','#a30a1a','#5a000a','#c1121f'];
  for(let k=0;k<7;k++){const cx=8+Math.random()*84,cy=60+Math.random()*80;
    for(let i=0;i<10;i++){const a=Math.random()*6.28,d=Math.random()*14,r=.6+Math.random()*3.4;
      s+=`<circle class="c" cx="${(cx+Math.cos(a)*d).toFixed(1)}" cy="${(cy+Math.sin(a)*d*1.6).toFixed(1)}" r="${r.toFixed(1)}" fill="${C[i%4]}" style="--d:${(1.4+k*.05+Math.random()*.15).toFixed(2)}s"/>`}}
  return `<svg class="spl" viewBox="0 0 100 200" preserveAspectRatio="xMidYMid slice">${s}</svg>`;
}
function fx(ev,cb){
  const el=document.createElement('div');let h='';
  if(ev=='dead'){
    let d='';for(let i=0;i<14;i++)d+=`<i class="dr2" style="left:${Math.random()*96}%;width:${8+Math.random()*16}px;--h:${25+Math.random()*50}%;--t:${1.6+Math.random()*1.6}s;--d:${1.6+Math.random()*.8}s"></i>`;
    el.className='fx fk';
    h=`<div class="gap"></div><div class="ha"></div><div class="hb"></div>${splats()}${d}<div class="kb">${KN}</div><div class="wf"></div><div class="vg"></div><div class="bar t"></div><div class="bar b"></div><div class="cap2">تمّت التصفية<small>سالت الدماء… ولم يُنقذ</small></div>`;
  }else{
    let s='';for(let i=0;i<16;i++)s+=`<i class="spk" style="--a:${i*22.5}deg;--r:${70+Math.random()*80}px"></i>`;
    el.className='fx fs';
    h=`<svg class="ecg" viewBox="0 0 400 100" preserveAspectRatio="none"><path class="fl" d="M0 50 H400"/><path class="hbp" d="M0 50 H110 L125 50 L135 22 L150 88 L165 6 L182 62 L194 50 H400"/></svg><div class="kb2">${KN}</div><svg class="sh" viewBox="0 0 120 140"><path d="M60 4 L112 26 V70 C112 104 88 128 60 138 C32 128 8 104 8 70 V26 Z" fill="#0b3b44cc" stroke="#5cf2e6" stroke-width="3"/><path class="crk" d="M60 6 L54 38 L68 58 L52 84 L62 110" fill="none" stroke="#d5fffb" stroke-width="2"/><text x="60" y="88" text-anchor="middle" font-size="58" fill="#5cf2e6" font-weight="800">+</text></svg><i class="rg2" style="--d:1.35s"></i><i class="rg2" style="--d:1.6s"></i>${s}<div class="wf c"></div><div class="vg g"></div><div class="bar t"></div><div class="bar b"></div><div class="cap2 s">${ev=='doc'?'تدخّل الطبيب':'ضحّى الحارس بنفسه'}<small>${ev=='doc'?'نجا في اللحظة الأخيرة':'ونجا الهدف'}</small></div>`;
  }
  el.innerHTML=h;document.body.appendChild(el);
  let fin=false;const end=()=>{if(fin)return;fin=true;el.style.transition='opacity .4s';el.style.opacity=0;setTimeout(()=>{el.remove();cb()},400)};
  setTimeout(end,4800);el.onclick=end;
  try{navigator.vibrate&&navigator.vibrate(ev=='dead'?[300,400,80,60,250]:[120,500,90,60,90,120,60])}catch(e){}
}
const MS='<svg viewBox="0 0 120 150"><path d="M60 6C26 6 8 34 12 72C16 112 38 144 60 144C82 144 104 112 108 72C112 34 94 6 60 6Z" fill="#f4eee2" stroke="#cbbf9f" stroke-width="2"/><path d="M26 66Q40 54 54 68Q40 76 26 66ZM66 68Q80 54 94 66Q80 76 66 68Z" fill="#111"/><path d="M40 104Q60 118 80 104" stroke="#111" stroke-width="3" fill="none"/></svg>';
const HD='<svg viewBox="0 0 120 150"><path d="M60 6C26 6 8 34 12 72C16 112 38 144 60 144C82 144 104 112 108 72C112 34 94 6 60 6Z" fill="#0c0709" stroke="#7a0010" stroke-width="2"/><ellipse cx="40" cy="68" rx="12" ry="5" fill="#ff1f3a"/><ellipse cx="80" cy="68" rx="12" ry="5" fill="#ff1f3a"/></svg>';
function city(){
  let s='',x=0;
  while(x<400){const w=26+Math.random()*22,h=60+Math.random()*100;
    s+=`<rect x="${x.toFixed(1)}" y="${(200-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="#0b0610"/>`;
    for(let yy=200-h+8;yy<192;yy+=13)for(let xx=x+5;xx<x+w-7;xx+=10)if(Math.random()<.6)s+=`<rect class="wn" x="${xx.toFixed(1)}" y="${yy.toFixed(1)}" width="5" height="6" fill="#ffd27a" style="--d:${(.4+Math.random()*2.2).toFixed(2)}s"/>`;
    x+=w+2}
  return `<svg class="city" viewBox="0 0 400 200" preserveAspectRatio="xMidYMax slice">${s}</svg>`;
}
function fx2(t,name,cb){
  const el=document.createElement('div');let h='';
  if(t=='exp'){
    el.className='fx fe';
    h=`<div class="spot"></div><div class="bk">${HD}</div><div class="mk l">${MS}</div><div class="mk r">${MS}</div><i class="mcrk"></i><div class="wf r"></div><div class="stamp">مافيا</div><div class="cap2 e">سقط القناع!<small>${esc(name)} كان من المافيا</small></div><div class="vg"></div><div class="bar t"></div><div class="bar b"></div>`;
  }else{
    let e='';for(let i=0;i<22;i++)e+=`<i class="em" style="left:${Math.random()*100}%;--t:${3+Math.random()*3}s;--d:${Math.random()*3}s;--x:${(Math.random()-.5)*80}px"></i>`;
    el.className='fx fw';
    h=`<div class="lt"></div><div class="moon"></div>${city()}<div class="fog"></div><div class="fog f2"></div>${e}<div class="vg"></div><div class="bar t"></div><div class="bar b"></div><div class="cap2 w">فازت المافيا<small>المدينة الآن في قبضتهم</small></div>`;
  }
  el.innerHTML=h;document.body.appendChild(el);
  let fin=false;const done2=()=>{if(fin)return;fin=true;el.style.transition='opacity .4s';el.style.opacity=0;setTimeout(()=>{el.remove();cb()},400)};
  setTimeout(done2,t=='exp'?4800:5600);el.onclick=done2;
  try{navigator.vibrate&&navigator.vibrate(t=='exp'?[0,1700,200,120,300,150]:[200,300,150,150,500])}catch(e){}
}
const _tally=tally;
tally=function(){
  const bf=G.p.map(p=>p.a),s0=show;let html='';show=h=>{html=h};
  try{_tally()}finally{show=s0}
  const d=G.p.find((p,i)=>bf[i]&&!p.a);
  if(d&&isM(d)&&S.reveal)fx2('exp',d.n,()=>show(html));else show(html);
};
const _end=end;
end=function(w){
  if(w!='maf')return _end(w);
  const s0=show;let html='';show=h=>{html=h};
  try{_end(w)}finally{show=s0}
  fx2('win','',()=>show(html));
};
setup();
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
